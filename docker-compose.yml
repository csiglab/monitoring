
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse
    # environment:
      # CLICKHOUSE_USER: admin
      # CLICKHOUSE_PASSWORD: admi
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.0.4
    container_name: fluent-bit
    depends_on:
      - clickhouse
    volumes:
      - ./fluent-bit:/fluent-bit/etc
      - .:/logs:ro
      - fluentbit-state:/fluent-bit/state
    command: >
      /fluent-bit/bin/fluent-bit
      -c /fluent-bit/etc/fluent-bit.conf
    restart: unless-stopped

volumes:
  clickhouse-data:
  fluentbit-state:
